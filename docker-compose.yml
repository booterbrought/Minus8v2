services:
  game-server:
    build:
      context: .
      dockerfile: DOCKERFILE
    container_name: minus8-game-server
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Telegram Mini App (optional; set in /opt/minus8-game/.env on the server)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
    volumes:
      # TLS is terminated by nginx on the host; do NOT mount /etc/letsencrypt here —
      # if the app sees the certs it serves HTTPS on port 3000 itself and nginx's
      # plain-HTTP upstream + the HTTP healthcheck both break (502).
      - ./data:/app/backend/db/data